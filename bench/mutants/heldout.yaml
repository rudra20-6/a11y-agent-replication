# Additional hand-written barriers (not used in the paper). Same shape as catalog.yaml.
#   affects:     profiles whose task this mutant blocks or clearly degrades (a finding here is a true positive)
#   may_affect:  profiles where a report is defensible (not counted as a false positive, not required)
#   any other profile reporting it  -> false positive
#   axe_expected: our prediction of whether axe-core flags it
#   why:         one sentence on how it stops which user on that task
# Profiles: P1 screen reader, P2 keyboard only, P3 400% zoom, P4 colour-vision deficiency, P5 voice control.

mutants:
  - {id: H01_key_trap_from, op: h_key_trap, sel: "#from", task: T1_flight_search, check: Operate, sc: "2.1.2", affects: [P2], may_affect: [P1], severity: blocks, axe_expected: missed, why: "A keyboard-only user who tabs into the From field cannot Tab or Shift+Tab out of it, so they never reach the To field, the date or the Search button."}
  - {id: H02_focus_reset_after_date, op: h_focus_reset_on_remove, sel: "[data-bench=date-backdrop]", task: T1_flight_search, check: Notice, sc: "2.4.3", affects: [P1, P2], may_affect: [], severity: degrades, axe_expected: missed, why: "After a date is chosen or the calendar is cancelled, focus is dropped to the top of the page, so a screen-reader or keyboard-only user has to work their way back to the form from the beginning."}
  - {id: H03_clip_fares_zoom, op: h_clip_narrow, sel: ".results", task: T2_flight_cheapest, check: Identify, sc: "1.4.10, 1.4.4", affects: [P3], may_affect: [], severity: blocks, axe_expected: missed, why: "At 400% zoom each fare row is cut off with an ellipsis before the price and the cheapest marker, so a low-vision user cannot see which fare is cheapest."}
  - {id: H04_reverse_order, op: h_reverse_order, sel: ".results", task: T2_flight_cheapest, check: Operate, sc: "1.3.2, 2.4.3", affects: [P2], may_affect: [], severity: degrades, axe_expected: missed, why: "The fares are drawn in the opposite order to the tab and arrow-key order, so a keyboard-only user pressing Down moves up the screen and loses track of which fare they are on."}
  - {id: H05_tab_scramble, op: h_tabindex_pos, sel: "[data-bench=passenger-form]", tabs: ["#pphone", "[data-bench=passenger-submit]", "#pname", "#pemail"], task: T3_passenger_details, check: Reach, sc: "2.4.3", affects: [P2], may_affect: [P1], severity: degrades, axe_expected: caught, why: "Tab visits the mobile number, then the submit button, then name and email, and from email it leaves the form, so a keyboard-only user cannot fill the form in reading order."}
  - {id: H06_swap_names, op: h_swap_names, sel: "[data-bench=passenger-form]", pair: [pemail, pphone], task: T3_passenger_details, check: Identify, sc: "1.3.1, 2.4.6, 2.5.3, 4.1.2", affects: [P1, P5], may_affect: [], severity: degrades, axe_expected: missed, why: "The Email field is announced as Mobile number and the Mobile number field as Email, so a screen-reader user, or a voice user saying click Email, lands in the wrong box."}
  - {id: H07_error_link_wrong, op: h_error_link_wrong, sel: "[data-bench=error-link]", to: pname, task: T3_passenger_details, check: Recover, sc: "3.3.1, 2.4.3", affects: [P1, P2], may_affect: [P3, P5], severity: degrades, axe_expected: missed, why: "Activating the error link in the summary puts focus in the Full name field instead of the field that is wrong, so a screen-reader or keyboard-only user is sent to the wrong place when fixing the mobile number."}
  - {id: H08_result_aria_hidden, op: h_aria_hide, sel: "[data-bench=sip-result]", task: T4_sip, check: Notice, sc: "1.3.1, 4.1.3", affects: [P1], may_affect: [], severity: blocks, axe_expected: missed, why: "The invested, returns and total figures are removed from the accessibility tree, so a screen-reader user can change the inputs but never hears the estimated returns."}
  - {id: H09_chart_colour_key, op: h_chart_colour, sel: "[data-bench=sip-bars]", result: "[data-bench=sip-result]", task: T4_sip, check: Identify, sc: "1.4.1", affects: [P4], may_affect: [], severity: blocks, axe_expected: missed, why: "The result is shown only as two unlabelled amounts beside red and green swatches with a key that names the colours, so a red-green colour-blind user cannot tell which amount is the estimated returns."}
  - {id: H10_hover_only_add, op: h_hover_reveal, sel: "[data-bench=add-to-cart]", card: "[data-bench=product]", task: T5_shop_headphones, check: Reach, sc: "2.4.7, 1.4.13", affects: [P2], may_affect: [P5], severity: blocks, axe_expected: missed, why: "The Add to cart buttons are only drawn while the mouse is over a product card, so a keyboard-only user tabs onto buttons they cannot see and cannot tell which product they are adding."}
  - {id: H11_fake_checkbox, op: h_fake_checkbox, sel: "[data-bench=filter-cat]", task: T5_shop_headphones, check: Identify, sc: "4.1.2, 1.3.1", affects: [P1], may_affect: [P5], severity: degrades, axe_expected: missed, why: "The category filters are plain focusable boxes with no checkbox role or checked state, so a screen-reader user hears only the word Headphones and cannot tell it is a toggle or whether it is on."}
  - {id: H12_fixed_panel_narrow, op: h_fixed_panel, sel: "[data-bench=pin-form]", height: 55, task: T6_shop_pincode, check: Reach, sc: "1.4.10, 2.4.11", affects: [P3], may_affect: [], severity: degrades, axe_expected: missed, why: "At 320 CSS px a chat panel pinned to the bottom of the screen covers the Check delivery button, so a low-vision user at 400% zoom cannot click it until they find the small close button."}
  - {id: H13_text_image_button, op: h_text_image, sel: "[data-bench=pin-check]", alt: "Go", task: T6_shop_pincode, check: Identify, sc: "1.4.5, 2.5.3, 4.1.2", affects: [P5], may_affect: [P1], severity: blocks, axe_expected: missed, why: "The Check delivery button's visible words are drawn as an image whose accessible name is just Go, so a voice-control user saying click Check delivery matches nothing."}
  - {id: H14_selected_hue_only, op: h_selected_hue, sel: ".seat", task: T7_seat_women, check: Notice, sc: "1.4.1", affects: [P4], may_affect: [], severity: degrades, axe_expected: missed, why: "A selected seat is shown only by its border changing between hues that look alike to red-green colour-blind users, so they cannot see on the map which seat they have chosen."}
  # Harmless: nothing a user can notice changes. Any report is a false positive.
  - {id: H15_benign_redundant_role, op: h_benign_role, sel: "[data-bench=products]", role: list, task: T5_shop_headphones, check: none, sc: "", affects: [], may_affect: [], severity: none, axe_expected: missed, why: "Repeats the list role the element already has, so nothing a user can perceive changes."}
  - {id: H16_benign_same_label, op: h_benign_same_label, sel: "[data-bench=nav-sip]", task: T4_sip, check: none, sc: "", affects: [], may_affect: [], severity: none, axe_expected: missed, why: "Sets an aria-label identical to the link's visible text, so its name and appearance stay the same."}
